
<!-- Team Section -->
    <section id="team" class="team section light-background">

      <!-- Section Title -->
      <div class="container section-title pb-4" data-aos="fade-up">
        <h2>area clienti</h2>
        <p><span>Lista dei</span> <span class="description-title"> Clienti</span></p>
      </div><!-- End Section Title -->

      <div class="container container-profile">

        <div class="row gy-4">

          <div class="team-profile col-lg-3 col-md-6 d-flex align-items-stretch" data-aos="fade-up" data-aos-delay="100" *ngFor="let customer of customers">
            <div class="team-member">
              <div class="member-img">
                <img src="img/team/bluepic.jpg" class="img-fluid" alt="">
                <div class="social flex-column" style="height: 60px;">
                  <p><i class="bi bi-envelope"></i> {{customer.emailContatto}}</p>
                  <p><i class="bi bi-telephone"></i> {{customer.telefonoContatto}}</p>
                </div>
              </div>
              <div class="member-info" (click)="clickUser(customer)">
                <h4>{{customer.nomeContatto}} {{customer.cognomeContatto}}</h4>
                <span>{{customer.tipoCliente}}</span>
              </div>
            </div>
          </div><!-- End Team Member -->

        </div>

      </div>

    </section><!-- /Team Section -->

    <app-detail-clienti *ngIf="clienti" [clienti]="clienti" [invoices]="invoices"></app-detail-clienti>
