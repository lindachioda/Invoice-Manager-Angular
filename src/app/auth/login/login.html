 <div class="container section-title pb-3" data-aos="fade-up">
        <h2>Accedi</h2>

       <div class="container" data-aos="fade-up" data-aos-delay="100">
    
        <div class="row gy-4 justify-content-center">

          <div class="col-lg-6">
            <form #loginForm="ngForm" (ngSubmit)="onSubmitLogin(loginForm)" action="forms/contact.php" method="post" class="php-email-form d-flex justify-content-between" data-aos="fade-up" data-aos-delay="200">
