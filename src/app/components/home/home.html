
<main class="main">

    <!-- Hero Section -->
    <section id="hero" class="hero section light-background">

      <div class="container">
        <div class="row gy-4">
          <div class="col-lg-6 order-2 order-lg-1 d-flex flex-column justify-content-center align-items-center" data-aos="zoom-out">
            
            <h1 *ngIf="firstname; else default">Welcome <span> {{ firstname }}</span></h1>
            <ng-template #default><h1>Welcome to <span>InvoicesIT</span></h1></ng-template>
            
            <p *ngIf="firstname; else pDefault">Ciao {{ firstname }}! Esplora la tua area personale!</p>
            <ng-template #pDefault><p>Registrati o accedi alla tua area personale per gestire le fatture</p></ng-template>

            <div *ngIf="!firstname" class="d-flex gap-4 mt-4 align-items-center">
              <a routerLink="login" class="btn-get-started">ACCEDI</a>
              <a routerLink="signup" class="btn-get-started">REGISTRATI</a>
           </div>
          </div>
        </div>
      </div>

    </section><!-- /Hero Section -->

    <!-- Featured Services Section -->
   
    <!-- Contact Section -->
  </main>
